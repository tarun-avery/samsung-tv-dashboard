<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132733"><meta name="referrer" content="no-referrer">
  <title>Watchlist · TV Dashboard</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body>
<header><div class="header-inner"><span class="screen" aria-hidden="true"></span><strong>TV Dashboard</strong><span class="app-name">Watchlist</span></div></header>
<main>
  <section id="pairing">
    <h1>Connect to your TV</h1>
    <p>Open <strong>TV guide → Add from phone</strong> on your TV. Enter the pairing code displayed there.</p>
    <form id="code-form">
      <label for="code">Pairing code</label>
      <input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="00000000" autocomplete="one-time-code" required>
      <button type="submit">Connect</button>
    </form>
  </section>
  <section id="composer" hidden>
    <h1>Add a title</h1>
    <form id="title-form">
      <fieldset><legend>Type</legend><div class="segments">
        <label><input type="radio" name="kind" value="film" checked><span>Film</span></label>
        <label><input type="radio" name="kind" value="series"><span>Series</span></label>
      </div></fieldset>
      <label for="title">Title</label><input id="title" name="title" placeholder="Title on your streaming service" maxlength="80" required>
      <div class="numbers">
        <div><label for="minutes" id="runtime-label">Running time</label><div class="suffix"><input id="minutes" name="minutes" type="number" min="1" max="999" step="1" inputmode="numeric" required><span>min</span></div></div>
        <div class="series-field" hidden><label for="season">Season</label><input id="season" name="season" type="number" min="1" max="999" step="1" value="1" inputmode="numeric" required disabled></div>
        <div class="series-field" hidden><label for="episode">Next episode</label><input id="episode" name="episode" type="number" min="1" max="999" step="1" value="1" inputmode="numeric" required disabled></div>
      </div>
      <label for="service">Streaming service</label>
      <select id="service" name="service" required><option value="">Choose service</option><option>Netflix</option><option>Paramount+</option><option>Crunchyroll</option><option>Prime Video</option><option>Apple TV</option><option>Disney+</option></select>
      <button type="submit">Add to TV watchlist <span aria-hidden="true">↗</span></button>
    </form>
  </section>
  <output id="status" role="status" aria-live="polite"></output>
</main>
</body></html>
